<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <!-- Navy Blue Background -->
  <rect width="600" height="200" rx="20" fill="#1E3765" />

  <!-- Pure White Official UofT Logo Mark -->
  <g fill="#FFFFFF" transform="translate(30, 20)">
    <!-- Crest Shield Icon -->
    <g transform="translate(10, 5) scale(0.32)">
      <!-- Tree on Top of Shield -->
      <path d="M 125,5 C 105,5 85,25 85,55 C 65,55 50,75 55,100 C 35,110 35,135 55,145 C 55,160 70,175 90,175 L 160,175 C 180,175 195,160 195,145 C 215,135 215,110 195,100 C 200,75 185,55 165,55 C 165,25 145,5 125,5 Z M 120,130 L 120,180 L 130,180 L 130,130 Z" />

      <!-- Shield Outline -->
      <path d="M 50,185 L 200,185 L 200,320 C 200,410 125,470 125,470 C 125,470 50,410 50,320 Z M 65,200 L 65,315 C 65,390 125,445 125,445 C 125,445 185,390 185,315 L 185,200 Z" />

      <!-- Horizontal Divider Lines in Shield -->
      <line x1="65" y1="260" x2="185" y2="260" stroke="#FFFFFF" stroke-width="6" />
      <line x1="65" y1="330" x2="185" y2="330" stroke="#FFFFFF" stroke-width="6" />

      <!-- Top Section of Shield: 2 Crowns -->
      <g transform="translate(85, 210) scale(0.6)">
        <path d="M 0,40 L 60,40 L 50,60 L 10,60 Z M 5,35 L -10,-10 L 15,15 L 30,-25 L 45,15 L 70,-10 L 55,35 Z" />
      </g>
      <g transform="translate(135, 210) scale(0.6)">
        <path d="M 0,40 L 60,40 L 50,60 L 10,60 Z M 5,35 L -10,-10 L 15,15 L 30,-25 L 45,15 L 70,-10 L 55,35 Z" />
      </g>

      <!-- Middle Section of Shield: Open Book -->
      <g transform="translate(125, 295) scale(0.7)">
        <path d="M -50,-15 Q -25,-25 0,-10 Q 25,-25 50,-15 L 50,25 Q 25,15 0,27 Q -25,15 -50,25 Z M -42,-5 L -8,-18 L -8,15 L -42,20 Z M 42,-5 L 8,-18 L 8,15 L 42,20 Z" />
      </g>

      <!-- Lower Section of Shield: Beaver / Water Waves -->
      <g transform="translate(125, 380) scale(0.65)">
        <!-- Beaver Silhouette -->
        <path d="M -30,10 Q -40,-10 -20,-20 Q 0,-25 20,-15 Q 35,-5 40,15 L -30,15 Z" />
        <!-- Waves -->
        <path d="M -50,30 Q -25,20 0,30 Q 25,40 50,30" stroke="#FFFFFF" stroke-width="6" fill="none" />
      </g>

      <!-- Scroll Ribbon at Bottom -->
      <path d="M 30,465 Q 125,495 220,465 L 210,485 Q 125,510 40,485 Z" />
    </g>

    <!-- Official Typography: UNIVERSITY OF TORONTO -->
    <text x="125" y="70" fill="#FFFFFF" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="21" letter-spacing="4" font-weight="400">
      UNIVERSITY OF
    </text>
    <text x="123" y="125" fill="#FFFFFF" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="52" letter-spacing="4" font-weight="500">
      TORONTO
    </text>
  </g>
</svg>
